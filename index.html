<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>todo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles/main.scss" />

    <script src="/src/scripts/main.js" defer></script>
  </head>
  <body>
    <section class="main">
      <div class="container">
        <div class="main__wrapper">
          <h1 class="title">My Tasks</h1>
          <div class="add">
            <input
              class="add__input"
              id="input-text"
              type="text"
              data-input-text
              placeholder="Type your task here.."
            />
            <button class="add__btn">+ Add</button>
          </div>
          <div class="content">
            <div class="content__item">
              <p class="content__text">Learn React</p>
            </div>
            <div class="content__item">
              <p class="content__text">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Et
                repellendus laboriosam nobis voluptate corporis tempore vel,
                suscipit, tenetur dolore illum enim voluptatem cum vitae rerum
                architecto? Magni dolorem commodi laborum?
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
